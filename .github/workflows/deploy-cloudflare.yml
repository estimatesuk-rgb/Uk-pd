name: Deploy UKPD to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ukpd-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish UKPD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install image tools for branded iPhone icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Generate branded app icons
        run: |
          command -v convert >/dev/null || { echo "ImageMagick convert is required to generate app icons"; exit 1; }
          for size in 180 192 512; do
            width=$((size * 9 / 10))
            convert -size "${size}x${size}" "xc:#152b48" \
              \( public/ukpd-logo.jpg -resize "${width}x${width}" \) \
              -gravity center -composite "public/icon-${size}.png"
          done
          cp public/icon-180.png public/apple-touch-icon.png
      - name: Build site
        run: npm run build
      - name: Verify site files
        run: test -s dist/index.html && test -d dist/assets
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository Actions secrets before deploying."
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        run: npx --no-install wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
