name: IFC4 geometry verification
on:
  push:
    paths:
      - 'src/ifcExport.mjs'
      - 'tests/ifcExport.test.mjs'
      - '.github/workflows/ifc4-tests.yml'
  workflow_dispatch:
jobs:
  ifc4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test IFC4 geometry exporter
        run: node --test tests/ifcExport.test.mjs
