name: BIM workbench build and geometry verification
on:
  push:
    paths:
      - 'src/DrawingViewWorkbench.jsx'
      - 'src/BimScene3D.jsx'
      - 'src/drawingViewModel.mjs'
      - 'src/bimArchitecturalParts.mjs'
      - 'src/ifcExport.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ifc4-tests.yml'
  pull_request:
    paths:
      - 'src/DrawingViewWorkbench.jsx'
      - 'src/BimScene3D.jsx'
      - 'src/drawingViewModel.mjs'
      - 'src/bimArchitecturalParts.mjs'
      - 'src/ifcExport.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ifc4-tests.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build production application
        run: npm run build
